<!-- index.html — Мессенджер с фиксом для мобильных устройств -->
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0084ff">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <title>Мессенджер v2.1</title>
    <style>
        :root {
            --bg: #f0f2f5;
            --surface: #ffffff;
            --primary: #0084ff;
            --primary-hover: #006ed0;
            --bubble-me: #0084ff;
            --bubble-other: #e4e6eb;
            --bubble-me-text: #ffffff;
            --bubble-other-text: #050505;
            --border: #d8dadf;
            --radius: 18px;
            --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            height: 100%;
            overflow: hidden;
            /* Предотвращаем pull-to-refresh на мобильных */
            overscroll-behavior: none;
        }

        body {
            font-family: var(--font);
            background: var(--bg);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            height: -webkit-fill-available; /* Фикс для iOS Safari */
            padding: 0;
            color: #1c1e21;
        }

        .messenger {
            width: 100%;
            height: 100%;
            max-width: 480px;
            background: var(--surface);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            /* На десктопе — с тенью и скруглениями */
            box-shadow: 0 2px 16px rgba(0,0,0,0.12);
        }

        /* На мобильных — на весь экран */
        @media (min-width: 481px) {
            .messenger {
                height: 90vh;
                max-height: 800px;
                border-radius: 12px;
            }
            body {
                padding: 16px;
            }
        }

        .header {
            padding: 14px 18px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            background: var(--surface);
            z-index: 2;
            flex-shrink: 0;
        }
        .header h2 { font-size: 1.1rem; font-weight: 600; flex: 1; min-width: 80px; }
        .header input {
            padding: 8px 14px;
            border: 1px solid var(--border);
            border-radius: 20px;
            font-size: 0.9rem;
            width: 100px;
            outline: none;
            min-width: 70px;
            /* Убираем автоувеличение на iOS */
            font-size: 16px;
        }
        .header input:focus { border-color: var(--primary); }

        .connection-status {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #f44336;
            transition: background 0.3s;
            flex-shrink: 0;
            box-shadow: 0 0 6px rgba(0,0,0,0.2);
        }
        .connection-status.online {
            background: #4caf50;
            box-shadow: 0 0 8px rgba(76,175,80,0.5);
        }
        .connection-status.connecting {
            background: #ff9800;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        .messages {
            flex: 1;
            overflow-y: auto;
            /* Плавная прокрутка ВЫКЛЮЧЕНА на мобильных — предотвращает конфликты */
            -webkit-overflow-scrolling: touch;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            background: var(--bg);
        }
        .messages::-webkit-scrollbar { width: 5px; }
        .messages::-webkit-scrollbar-thumb { background: #c1c1c1; border-radius: 3px; }

        .message {
            max-width: 85%;
            padding: 10px 14px;
            border-radius: var(--radius);
            word-wrap: break-word;
            font-size: 0.95rem;
            line-height: 1.4;
            animation: fadeIn 0.2s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.me {
            align-self: flex-end;
            background: var(--bubble-me);
            color: var(--bubble-me-text);
            border-bottom-right-radius: 4px;
        }
        .message.other {
            align-self: flex-start;
            background: var(--bubble-other);
            color: var(--bubble-other-text);
            border-bottom-left-radius: 4px;
        }

        .message .sender {
            font-size: 0.7rem;
            font-weight: 600;
            margin-bottom: 2px;
            opacity: 0.8;
        }
        .message .time {
            font-size: 0.65rem;
            opacity: 0.7;
            margin-top: 3px;
            text-align: right;
        }

        .empty-state {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #65676b;
            font-size: 0.9rem;
            text-align: center;
            padding: 20px;
        }

        .system-message {
            text-align: center;
            font-size: 0.7rem;
            color: #65676b;
            padding: 6px 10px;
            margin: 4px 0;
        }
        .system-message.error {
            color: #f44336;
            background: #ffebee;
            border-radius: 8px;
        }
        .system-message.success {
            color: #4caf50;
            background: #e8f5e9;
            border-radius: 8px;
        }

        .input-area {
            display: flex;
            gap: 8px;
            padding: 12px 16px;
            /* Дополнительный отступ снизу для iPhone без кнопки Home */
            padding-bottom: max(12px, env(safe-area-inset-bottom, 12px));
            border-top: 1px solid var(--border);
            background: var(--surface);
            z-index: 2;
            flex-shrink: 0;
        }
        .input-area input {
            flex: 1;
            padding: 12px 16px;
            border: 1px solid var(--border);
            border-radius: 24px;
            font-size: 16px; /* Предотвращает зум на iOS */
            outline: none;
            min-width: 0;
        }
        .input-area input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(0,132,255,0.15);
        }
        .input-area button {
            padding: 10px 20px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 24px;
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
            transition: 0.2s;
            white-space: nowrap;
        }
        .input-area button:hover { background: var(--primary-hover); }
        .input-area button:active { transform: scale(0.97); }
        .input-area button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    <div class="messenger">
        <div class="header">
            <h2>💬 Общий чат</h2>
            <input
                type="text"
                id="usernameInput"
                placeholder="Ваше имя"
                maxlength="30"
                aria-label="Имя пользователя"
                autocomplete="off"
                autocorrect="off"
                autocapitalize="off"
                spellcheck="false"
            />
            <div class="connection-status" id="connectionStatus" title="Подключение..."></div>
        </div>

        <div class="messages" id="messagesContainer" aria-live="polite">
            <div class="empty-state">Загрузка сообщений...</div>
        </div>

        <div class="input-area">
            <input
                type="text"
                id="messageInput"
                placeholder="Сообщение..."
                maxlength="2000"
                aria-label="Текст сообщения"
                autocomplete="off"
                autocorrect="off"
                autocapitalize="off"
                spellcheck="true"
                disabled
            />
            <button id="sendBtn" type="button" disabled>Отпр.</button>
        </div>
    </div>

    <!-- Supabase JS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

    <script>
        (function() {
            'use strict';

            // ============ КОНФИГУРАЦИЯ ============
            const SUPABASE_URL = 'https://qylakybvspyxxwuvpiuw.supabase.co';
            const SUPABASE_ANON_KEY = 'sb_publishable_A6nWldtf6s6m2hiQC_YbWw_HcBXEazO';
            const MAX_MESSAGES_INITIAL = 50;
            
            // 🆕 Минимальный интервал между переподключениями (мс)
            const RECONNECT_MIN_INTERVAL = 10000; // 10 секунд
            // 🆕 Интервал пинга (держит соединение живым)
            const HEARTBEAT_INTERVAL = 30000; // 30 секунд

            // ============ ИНИЦИАЛИЗАЦИЯ SUPABASE ============
            const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
                realtime: {
                    params: {
                        eventsPerSecond: 10
                    }
                }
            });

            // ============ DOM-элементы ============
            const messagesContainer = document.getElementById('messagesContainer');
            const messageInput = document.getElementById('messageInput');
            const sendBtn = document.getElementById('sendBtn');
            const usernameInput = document.getElementById('usernameInput');
            const connectionStatus = document.getElementById('connectionStatus');

            // ============ СОСТОЯНИЕ ============
            let username = '';
            let messages = [];
            let realtimeChannel = null;
            let isConnected = false;
            let reconnectTimer = null;
            let lastReconnectAttempt = 0; // 🆕 Время последней попытки переподключения
            let isSending = false;
            let heartbeatTimer = null; // 🆕 Таймер пинга
            let systemMessageCount = 0; // 🆕 Счётчик системных сообщений

            // ============ УТИЛИТЫ ============
            function formatTime(isoString) {
                try {
                    return new Date(isoString).toLocaleTimeString('ru-RU', {
                        hour: '2-digit', minute: '2-digit'
                    });
                } catch { return '--:--'; }
            }

            function escapeHTML(str) {
                const div = document.createElement('div');
                div.appendChild(document.createTextNode(str));
                return div.innerHTML;
            }

            function addSystemMessage(text, type = '') {
                // 🆕 Ограничиваем количество системных сообщений в DOM
                const existingSystemMessages = messagesContainer.querySelectorAll('.system-message');
                if (existingSystemMessages.length > 3) {
                    existingSystemMessages[0].remove();
                }
                
                const div = document.createElement('div');
                div.className = 'system-message ' + type;
                div.textContent = text;
                div.dataset.timestamp = Date.now();
                messagesContainer.appendChild(div);
                messagesContainer.scrollTop = messagesContainer.scrollHeight;
                
                // 🆕 Удаляем не-ошибочные сообщения через 5 секунд
                if (type !== 'error') {
                    setTimeout(() => {
                        if (div.parentNode) {
                            div.remove();
                        }
                    }, 5000);
                }
            }

            // ============ СТАТУС СОЕДИНЕНИЯ ============
            function setConnectionStatus(status) {
                connectionStatus.classList.remove('online', 'connecting');
                
                switch(status) {
                    case 'connected':
                        connectionStatus.classList.add('online');
                        connectionStatus.title = 'Подключено';
                        isConnected = true;
                        enableInputs();
                        startHeartbeat(); // 🆕 Запускаем пинг
                        break;
                    case 'connecting':
                        connectionStatus.classList.add('connecting');
                        connectionStatus.title = 'Подключение...';
                        isConnected = false;
                        disableInputs();
                        break;
                    case 'disconnected':
                        connectionStatus.title = 'Нет соединения';
                        isConnected = false;
                        disableInputs();
                        stopHeartbeat(); // 🆕 Останавливаем пинг
                        break;
                }
            }

            function enableInputs() {
                if (username) {
                    messageInput.disabled = false;
                    sendBtn.disabled = false;
                }
            }

            function disableInputs() {
                messageInput.disabled = true;
                sendBtn.disabled = true;
            }

            // 🆕 Heartbeat — держит соединение живым
            function startHeartbeat() {
                stopHeartbeat();
                heartbeatTimer = setInterval(async () => {
                    if (isConnected) {
                        try {
                            // Лёгкий запрос к БД для проверки соединения
                            const { error } = await supabase
                                .from('messages')
                                .select('id', { count: 'exact', head: true })
                                .limit(1);
                            
                            if (error) {
                                console.warn('Heartbeat failed:', error);
                                setConnectionStatus('disconnected');
                                scheduleReconnect();
                            }
                        } catch (e) {
                            console.warn('Heartbeat error:', e);
                        }
                    }
                }, HEARTBEAT_INTERVAL);
            }

            function stopHeartbeat() {
                if (heartbeatTimer) {
                    clearInterval(heartbeatTimer);
                    heartbeatTimer = null;
                }
            }

            // ============ ЗАГРУЗКА ИСТОРИИ ============
            async function loadHistory() {
                try {
                    const { data, error } = await supabase
                        .from('messages')
                        .select('*')
                        .order('created_at', { ascending: false })
                        .limit(MAX_MESSAGES_INITIAL);

                    if (error) throw error;

                    messages = (data || []).reverse();
                    renderMessages();
                    
                    if (messages.length === 0) {
                        messagesContainer.innerHTML = '<div class="empty-state">Нет сообщений. Начните общение!</div>';
                    }
                } catch (err) {
                    console.error('Ошибка загрузки истории:', err);
                    messagesContainer.innerHTML = '<div class="empty-state" style="color:#f44336">❌ Ошибка загрузки истории</div>';
                    addSystemMessage('❌ Ошибка загрузки истории', 'error');
                }
            }

            // ============ РЕНДЕРИНГ ============
            function renderMessages() {
                // Сохраняем только ошибочные системные сообщения
                const errorMessages = messagesContainer.querySelectorAll('.system-message.error');
                
                messagesContainer.innerHTML = '';
                
                if (messages.length === 0) {
                    messagesContainer.innerHTML = '<div class="empty-state">Нет сообщений. Начните общение!</div>';
                } else {
                    const fragment = document.createDocumentFragment();

                    messages.forEach(msg => {
                        const isMe = msg.sender === username;
                        const div = document.createElement('div');
                        div.className = 'message ' + (isMe ? 'me' : 'other');

                        let html = '';
                        if (!isMe) {
                            html += '<div class="sender">' + escapeHTML(msg.sender) + '</div>';
                        }
                        html += escapeHTML(msg.text);
                        html += '<div class="time">' + formatTime(msg.created_at) + '</div>';
                        div.innerHTML = html;

                        fragment.appendChild(div);
                    });

                    messagesContainer.appendChild(fragment);
                }
                
                // Восстанавливаем сообщения об ошибках
                errorMessages.forEach(el => {
                    if (el.dataset.timestamp && (Date.now() - parseInt(el.dataset.timestamp)) < 10000) {
                        messagesContainer.appendChild(el);
                    }
                });
                
                messagesContainer.scrollTop = messagesContainer.scrollHeight;
            }

            // ============ ОТПРАВКА СООБЩЕНИЯ ============
            async function sendMessage() {
                const text = messageInput.value.trim();
                if (!text || !username || isSending) return;

                isSending = true;
                sendBtn.disabled = true;

                try {
                    const { error } = await supabase
                        .from('messages')
                        .insert([{
                            text: text,
                            sender: username,
                        }]);

                    if (error) throw error;

                    messageInput.value = '';
                    messageInput.focus();
                    
                } catch (err) {
                    console.error('Ошибка отправки:', err);
                    addSystemMessage('❌ Не удалось отправить', 'error');
                    
                    // Возвращаем кнопку через 1 секунду
                    setTimeout(() => {
                        isSending = false;
                        if (username && isConnected) {
                            sendBtn.disabled = false;
                        }
                    }, 1000);
                    return;
                }
                
                isSending = false;
                sendBtn.disabled = false;
            }

            // ============ REAL-TIME ПОДПИСКА ============
            function subscribeToRealtime() {
                // Отписываемся от предыдущего канала
                if (realtimeChannel) {
                    try {
                        supabase.removeChannel(realtimeChannel);
                    } catch(e) {
                        console.warn('Ошибка при удалении канала:', e);
                    }
                }

                setConnectionStatus('connecting');

                realtimeChannel = supabase
                    .channel('public:messages')
                    .on(
                        'postgres_changes',
                        {
                            event: 'INSERT',
                            schema: 'public',
                            table: 'messages',
                        },
                        (payload) => {
                            const newMsg = payload.new;
                            
                            // Защита от дублей
                            const exists = messages.some(m => m.id === newMsg.id);
                            if (!exists) {
                                messages.push(newMsg);
                                if (messages.length > 200) {
                                    messages = messages.slice(-200);
                                }
                                renderMessages();
                            }
                        }
                    )
                    .subscribe((status, err) => {
                        console.log('Realtime статус:', status, err ? err.message : '');
                        
                        if (status === 'SUBSCRIBED') {
                            console.log('✅ Подключено к real-time');
                            setConnectionStatus('connected');
                            lastReconnectAttempt = 0; // Сбрасываем таймер
                        } else if (status === 'CHANNEL_ERROR') {
                            console.error('❌ Ошибка канала');
                            setConnectionStatus('disconnected');
                            scheduleReconnect();
                        } else if (status === 'CLOSED') {
                            console.log('Канал закрыт');
                            setConnectionStatus('disconnected');
                            scheduleReconnect();
                        } else if (status === 'TIMED_OUT') {
                            console.log('Таймаут канала');
                            setConnectionStatus('disconnected');
                            scheduleReconnect();
                        }
                    });
            }

            // 🆕 ИСПРАВЛЕНО: debounce на переподключение
            function scheduleReconnect() {
                // Очищаем предыдущий таймер
                if (reconnectTimer) {
                    clearTimeout(reconnectTimer);
                    reconnectTimer = null;
                }
                
                const now = Date.now();
                const timeSinceLastReconnect = now - lastReconnectAttempt;
                
                // Если переподключались меньше 10 секунд назад — ждём дольше
                if (lastReconnectAttempt > 0 && timeSinceLastReconnect < RECONNECT_MIN_INTERVAL) {
                    console.log('⏳ Слишком частые переподключения. Ждём...');
                    return; // Пропускаем эту попытку
                }
                
                console.log('🔄 Планируем переподключение через 5 секунд...');
                addSystemMessage('🔄 Переподключение...', '');
                
                lastReconnectAttempt = now;
                
                reconnectTimer = setTimeout(() => {
                    console.log('🔄 Выполняем переподключение');
                    subscribeToRealtime();
                }, 5000);
            }

            // ============ ОБРАБОТЧИКИ СОБЫТИЙ ============
            sendBtn.addEventListener('click', sendMessage);
            
            messageInput.addEventListener('keydown', function(e) {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    sendMessage();
                }
            });

            // Имя пользователя
            usernameInput.addEventListener('input', function() {
                const newUsername = usernameInput.value.trim();
                if (newUsername !== username) {
                    username = newUsername;
                    localStorage.setItem('messenger_username', username);
                    
                    if (username && isConnected) {
                        enableInputs();
                    } else {
                        disableInputs();
                    }
                    
                    renderMessages();
                }
            });

            usernameInput.addEventListener('change', function() {
                const val = usernameInput.value.trim();
                if (val) {
                    localStorage.setItem('messenger_username', val);
                    username = val;
                    if (isConnected) {
                        enableInputs();
                    }
                    renderMessages();
                }
            });

            // ============ ЗАПУСК ============
            async function init() {
                // Восстанавливаем имя пользователя
                const savedUsername = localStorage.getItem('messenger_username');
                if (savedUsername) {
                    usernameInput.value = savedUsername;
                    username = savedUsername;
                }

                // Загружаем историю
                await loadHistory();
                
                // Подключаемся к real-time
                subscribeToRealtime();

                // Фокус на нужное поле
                setTimeout(() => {
                    if (username) {
                        messageInput.focus();
                    } else {
                        usernameInput.focus();
                    }
                }, 500);
            }

            init();

            // 🆕 ИСПРАВЛЕНО: Только реальные события offline/online
            window.addEventListener('online', () => {
                console.log('📶 Браузер онлайн');
                if (!isConnected) {
                    scheduleReconnect();
                }
            });
            
            window.addEventListener('offline', () => {
                console.log('📴 Браузер офлайн');
                setConnectionStatus('disconnected');
            });

            // 🆕 УБИРАЕМ visibilitychange — на телефонах он срабатывает слишком часто
            // и вызывает шквал переподключений при блокировке/разблокировке экрана

            // Очистка при уходе со страницы
            window.addEventListener('beforeunload', () => {
                stopHeartbeat();
                if (reconnectTimer) {
                    clearTimeout(reconnectTimer);
                }
                if (realtimeChannel) {
                    try {
                        supabase.removeChannel(realtimeChannel);
                    } catch(e) {
                        // Игнорируем
                    }
                }
            });
        })();
    </script>
</body>
</html>
