<!-- messenger.html — Многопользовательский мессенджер на Supabase -->
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мессенджер v2.0</title>
    <style>
        :root {
            --bg: #f0f2f5;
            --surface: #ffffff;
            --primary: #0084ff;
            --primary-hover: #006ed0;
            --bubble-me: #0084ff;
            --bubble-other: #e4e6eb;
            --bubble-me-text: #ffffff;
            --bubble-other-text: #050505;
            --border: #d8dadf;
            --radius: 18px;
            --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: var(--font);
            background: var(--bg);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 16px;
            color: #1c1e21;
        }

        .messenger {
            width: 100%;
            max-width: 480px;
            height: 90vh;
            max-height: 800px;
            background: var(--surface);
            border-radius: 12px;
            box-shadow: 0 2px 16px rgba(0,0,0,0.12);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .header {
            padding: 14px 18px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            background: var(--surface);
            z-index: 2;
        }
        .header h2 { font-size: 1.1rem; font-weight: 600; flex: 1; min-width: 100px; }
        .header input {
            padding: 8px 14px;
            border: 1px solid var(--border);
            border-radius: 20px;
            font-size: 0.85rem;
            width: 100px;
            outline: none;
            min-width: 80px;
        }
        .header input:focus { border-color: var(--primary); }

        .connection-status {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #f44336;
            transition: background 0.3s;
            flex-shrink: 0;
            box-shadow: 0 0 6px rgba(0,0,0,0.2);
        }
        .connection-status.online {
            background: #4caf50;
            box-shadow: 0 0 8px rgba(76,175,80,0.6);
        }
        .connection-status.connecting {
            background: #ff9800;
            animation: pulse 1s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            background: var(--bg);
        }
        .messages::-webkit-scrollbar { width: 5px; }
        .messages::-webkit-scrollbar-thumb { background: #c1c1c1; border-radius: 3px; }

        .message {
            max-width: 80%;
            padding: 10px 14px;
            border-radius: var(--radius);
            word-wrap: break-word;
            font-size: 0.95rem;
            line-height: 1.4;
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.me {
            align-self: flex-end;
            background: var(--bubble-me);
            color: var(--bubble-me-text);
            border-bottom-right-radius: 4px;
        }
        .message.other {
            align-self: flex-start;
            background: var(--bubble-other);
            color: var(--bubble-other-text);
            border-bottom-left-radius: 4px;
        }

        .message .sender {
            font-size: 0.7rem;
            font-weight: 600;
            margin-bottom: 2px;
            opacity: 0.8;
        }
        .message .time {
            font-size: 0.65rem;
            opacity: 0.7;
            margin-top: 3px;
            text-align: right;
        }

        .empty-state {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #65676b;
            font-size: 0.9rem;
            text-align: center;
            padding: 20px;
        }

        .system-message {
            text-align: center;
            font-size: 0.75rem;
            color: #65676b;
            padding: 8px;
            margin: 4px 0;
        }
        .system-message.error {
            color: #f44336;
            background: #ffebee;
            border-radius: 8px;
        }
        .system-message.success {
            color: #4caf50;
            background: #e8f5e9;
            border-radius: 8px;
        }

        .input-area {
            display: flex;
            gap: 8px;
            padding: 12px 16px;
            border-top: 1px solid var(--border);
            background: var(--surface);
            z-index: 2;
        }
        .input-area input {
            flex: 1;
            padding: 12px 16px;
            border: 1px solid var(--border);
            border-radius: 24px;
            font-size: 0.95rem;
            outline: none;
            min-width: 0;
        }
        .input-area input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(0,132,255,0.15);
        }
        .input-area button {
            padding: 10px 20px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 24px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            white-space: nowrap;
        }
        .input-area button:hover { background: var(--primary-hover); }
        .input-area button:active { transform: scale(0.97); }
        .input-area button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    <div class="messenger">
        <div class="header">
            <h2>💬 Общий чат</h2>
            <input
                type="text"
                id="usernameInput"
                placeholder="Ваше имя"
                maxlength="30"
                aria-label="Имя пользователя"
            />
            <div class="connection-status" id="connectionStatus" title="Подключение..."></div>
        </div>

        <div class="messages" id="messagesContainer" aria-live="polite">
            <div class="empty-state">Загрузка сообщений...</div>
        </div>

        <div class="input-area">
            <input
                type="text"
                id="messageInput"
                placeholder="Введите сообщение..."
                maxlength="2000"
                aria-label="Текст сообщения"
                autocomplete="off"
                disabled
            />
            <button id="sendBtn" type="button" disabled>Отправить</button>
        </div>
    </div>

    <!-- Supabase JS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

    <script>
        (function() {
            'use strict';

            // ============ КОНФИГУРАЦИЯ ============
            const SUPABASE_URL = 'https://qylakybvspyxxwuvpiuw.supabase.co';
            const SUPABASE_ANON_KEY = 'sb_publishable_A6nWldtf6s6m2hiQC_YbWw_HcBXEazO';
            const MAX_MESSAGES_INITIAL = 50;

            // ============ ИНИЦИАЛИЗАЦИЯ SUPABASE ============
            const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
                realtime: {
                    params: {
                        eventsPerSecond: 10
                    }
                }
            });

            // ============ DOM-элементы ============
            const messagesContainer = document.getElementById('messagesContainer');
            const messageInput = document.getElementById('messageInput');
            const sendBtn = document.getElementById('sendBtn');
            const usernameInput = document.getElementById('usernameInput');
            const connectionStatus = document.getElementById('connectionStatus');

            // ============ СОСТОЯНИЕ ============
            let username = '';
            let messages = [];
            let realtimeChannel = null;
            let isConnected = false;
            let reconnectTimer = null;
            let isSending = false;

            // ============ УТИЛИТЫ ============
            function formatTime(isoString) {
                try {
                    return new Date(isoString).toLocaleTimeString('ru-RU', {
                        hour: '2-digit', minute: '2-digit'
                    });
                } catch { return '--:--'; }
            }

            function escapeHTML(str) {
                const div = document.createElement('div');
                div.appendChild(document.createTextNode(str));
                return div.innerHTML;
            }

            function addSystemMessage(text, type = '') {
                const div = document.createElement('div');
                div.className = 'system-message ' + type;
                div.textContent = text;
                messagesContainer.appendChild(div);
                messagesContainer.scrollTop = messagesContainer.scrollHeight;
            }

            // ============ СТАТУС СОЕДИНЕНИЯ ============
            function setConnectionStatus(status) {
                connectionStatus.classList.remove('online', 'connecting');
                
                switch(status) {
                    case 'connected':
                        connectionStatus.classList.add('online');
                        connectionStatus.title = 'Подключено';
                        isConnected = true;
                        enableInputs();
                        break;
                    case 'connecting':
                        connectionStatus.classList.add('connecting');
                        connectionStatus.title = 'Подключение...';
                        isConnected = false;
                        disableInputs();
                        break;
                    case 'disconnected':
                        connectionStatus.title = 'Нет соединения';
                        isConnected = false;
                        disableInputs();
                        addSystemMessage('⚠️ Соединение потеряно. Переподключение...', 'error');
                        break;
                }
            }

            function enableInputs() {
                if (username) {
                    messageInput.disabled = false;
                    sendBtn.disabled = false;
                }
            }

            function disableInputs() {
                messageInput.disabled = true;
                sendBtn.disabled = true;
            }

            // ============ ЗАГРУЗКА ИСТОРИИ ============
            async function loadHistory() {
                try {
                    const { data, error } = await supabase
                        .from('messages')
                        .select('*')
                        .order('created_at', { ascending: false })
                        .limit(MAX_MESSAGES_INITIAL);

                    if (error) throw error;

                    messages = (data || []).reverse();
                    renderMessages();
                    
                    if (messages.length === 0) {
                        messagesContainer.innerHTML = '<div class="empty-state">Нет сообщений. Начните общение!</div>';
                    }
                    
                    addSystemMessage('✅ История загружена (' + messages.length + ' сообщений)', 'success');
                    
                    // Удаляем сообщение "успех" через 3 секунды
                    setTimeout(() => {
                        const successMessages = messagesContainer.querySelectorAll('.system-message.success');
                        successMessages.forEach(el => el.remove());
                    }, 3000);
                    
                } catch (err) {
                    console.error('Ошибка загрузки истории:', err);
                    messagesContainer.innerHTML = '<div class="empty-state" style="color:#f44336">❌ Ошибка загрузки истории</div>';
                    addSystemMessage('❌ Ошибка загрузки: ' + err.message, 'error');
                }
            }

            // ============ РЕНДЕРИНГ ============
            function renderMessages() {
                // Сохраняем системные сообщения
                const systemMessages = messagesContainer.querySelectorAll('.system-message');
                
                messagesContainer.innerHTML = '';
                
                if (messages.length === 0) {
                    messagesContainer.innerHTML = '<div class="empty-state">Нет сообщений. Начните общение!</div>';
                } else {
                    const fragment = document.createDocumentFragment();

                    messages.forEach(msg => {
                        const isMe = msg.sender === username;
                        const div = document.createElement('div');
                        div.className = 'message ' + (isMe ? 'me' : 'other');

                        let html = '';
                        if (!isMe) {
                            html += '<div class="sender">' + escapeHTML(msg.sender) + '</div>';
                        }
                        html += escapeHTML(msg.text);
                        html += '<div class="time">' + formatTime(msg.created_at) + '</div>';
                        div.innerHTML = html;

                        fragment.appendChild(div);
                    });

                    messagesContainer.appendChild(fragment);
                }
                
                // Восстанавливаем системные сообщения, которые не старше 10 секунд
                systemMessages.forEach(el => {
                    if (el.dataset.timestamp && (Date.now() - parseInt(el.dataset.timestamp)) < 10000) {
                        messagesContainer.appendChild(el);
                    }
                });
                
                messagesContainer.scrollTop = messagesContainer.scrollHeight;
            }

            // ============ ОТПРАВКА СООБЩЕНИЯ ============
            async function sendMessage() {
                const text = messageInput.value.trim();
                if (!text || !username || isSending) return;

                isSending = true;
                sendBtn.disabled = true;

                try {
                    const { error } = await supabase
                        .from('messages')
                        .insert([{
                            text: text,
                            sender: username,
                        }]);

                    if (error) throw error;

                    messageInput.value = '';
                    messageInput.focus();
                    
                } catch (err) {
                    console.error('Ошибка отправки:', err);
                    addSystemMessage('❌ Ошибка отправки: ' + err.message, 'error');
                    
                    // Включаем обратно через 1 секунду
                    setTimeout(() => {
                        isSending = false;
                        if (username && isConnected) {
                            sendBtn.disabled = false;
                        }
                    }, 1000);
                    return;
                }
                
                isSending = false;
                sendBtn.disabled = false;
            }

            // ============ REAL-TIME ПОДПИСКА (ИСПРАВЛЕНО) ============
            function subscribeToRealtime() {
                // Отписываемся от предыдущего канала
                if (realtimeChannel) {
                    supabase.removeChannel(realtimeChannel);
                }

                setConnectionStatus('connecting');

                realtimeChannel = supabase
                    .channel('public:messages')
                    .on(
                        'postgres_changes',
                        {
                            event: 'INSERT',
                            schema: 'public',
                            table: 'messages',
                        },
                        (payload) => {
                            console.log('Новое сообщение:', payload.new);
                            const newMsg = payload.new;
                            
                            // Проверяем, нет ли уже такого сообщения (защита от дублей)
                            const exists = messages.some(m => m.id === newMsg.id);
                            if (!exists) {
                                messages.push(newMsg);
                                if (messages.length > 200) {
                                    messages = messages.slice(-200);
                                }
                                renderMessages();
                            }
                        }
                    )
                    .subscribe((status, err) => {
                        console.log('Realtime статус:', status, err);
                        
                        if (status === 'SUBSCRIBED') {
                            console.log('✅ Подключено к real-time');
                            setConnectionStatus('connected');
                            addSystemMessage('✅ Подключено к чату', 'success');
                        } else if (status === 'CHANNEL_ERROR') {
                            console.error('❌ Ошибка канала:', err);
                            setConnectionStatus('disconnected');
                            scheduleReconnect();
                        } else if (status === 'CLOSED') {
                            console.log('Канал закрыт');
                            setConnectionStatus('disconnected');
                            scheduleReconnect();
                        } else if (status === 'TIMED_OUT') {
                            console.log('Таймаут канала');
                            setConnectionStatus('disconnected');
                            scheduleReconnect();
                        }
                    });
            }

            function scheduleReconnect() {
                // Очищаем предыдущий таймер
                if (reconnectTimer) {
                    clearTimeout(reconnectTimer);
                }
                
                // Пробуем переподключиться через 3 секунды
                reconnectTimer = setTimeout(() => {
                    console.log('🔄 Попытка переподключения...');
                    addSystemMessage('🔄 Переподключение...', '');
                    subscribeToRealtime();
                }, 3000);
            }

            // ============ ОБРАБОТЧИКИ СОБЫТИЙ ============
            sendBtn.addEventListener('click', sendMessage);
            
            messageInput.addEventListener('keydown', function(e) {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    sendMessage();
                }
            });

            // Имя пользователя
            usernameInput.addEventListener('input', function() {
                const newUsername = usernameInput.value.trim();
                if (newUsername !== username) {
                    username = newUsername;
                    localStorage.setItem('messenger_username', username);
                    
                    if (username && isConnected) {
                        enableInputs();
                    } else {
                        disableInputs();
                    }
                    
                    renderMessages();
                }
            });

            // Сохранение имени при потере фокуса
            usernameInput.addEventListener('change', function() {
                const val = usernameInput.value.trim();
                if (val) {
                    localStorage.setItem('messenger_username', val);
                    username = val;
                    if (isConnected) {
                        enableInputs();
                    }
                    renderMessages();
                }
            });

            // ============ ЗАПУСК ============
            async function init() {
                // Восстанавливаем имя пользователя
                const savedUsername = localStorage.getItem('messenger_username');
                if (savedUsername) {
                    usernameInput.value = savedUsername;
                    username = savedUsername;
                }

                // Загружаем историю
                await loadHistory();
                
                // Подключаемся к real-time
                subscribeToRealtime();

                // Фокус на поле ввода, если имя уже есть
                if (username && isConnected) {
                    enableInputs();
                }
                
                setTimeout(() => {
                    if (username) {
                        messageInput.focus();
                    } else {
                        usernameInput.focus();
                    }
                }, 500);
            }

            init();

            // Обработка переподключения при возврате в онлайн
            window.addEventListener('online', () => {
                console.log('Браузер вернулся в онлайн');
                addSystemMessage('🌐 Интернет восстановлен', 'success');
                subscribeToRealtime();
                loadHistory();
            });
            
            window.addEventListener('offline', () => {
                console.log('Браузер офлайн');
                setConnectionStatus('disconnected');
            });

            // Переподключение при возвращении на вкладку
            document.addEventListener('visibilitychange', () => {
                if (document.visibilityState === 'visible' && !isConnected) {
                    console.log('Вкладка активна, переподключаемся');
                    subscribeToRealtime();
                }
            });
        })();
    </script>
</body>
</html>
